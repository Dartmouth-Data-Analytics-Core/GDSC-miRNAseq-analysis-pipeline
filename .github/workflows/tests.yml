name: Tests

on:
  push:
    branches: [dev-CI]
  pull_request:
    branches: [main]

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          APPTAINER_VERSION="1.3.3"
          wget https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb
          sudo apt-get install -y ./apptainer_${APPTAINER_VERSION}_amd64.deb
          sudo sysctl kernel.unprivileged_userns_clone=1
          sudo sysctl user.max_user_namespaces=15000
          sudo apptainer config fakeroot --add runner

      - name: Cache Singularity images
        uses: actions/cache@v4
        with:
          path: .snakemake/singularity
          key: singularity-${{ hashFiles('env_config/*.yaml') }}

      - name: Build test indices
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: tests/build_test_refs.smk
          args: "--use-singularity --cores 2 --show-failed-logs"

      - name: Run pipeline
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: Snakefile
          args: >-
            --configfile tests/fixtures/test_config.yaml
            --use-singularity
            --show-failed-logs
            --cores 2

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: .snakemake/log/
