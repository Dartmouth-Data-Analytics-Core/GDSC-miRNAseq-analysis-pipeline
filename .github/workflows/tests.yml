name: Tests

on:
  push:
    branches: [dev-CI]
  pull_request:
    branches: [main]

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Apptainer
        run: |
          APPTAINER_VERSION="1.3.3"
          wget -q https://github.com/apptainer/apptainer/releases/download/v${APPTAINER_VERSION}/apptainer_${APPTAINER_VERSION}_amd64.deb
          sudo apt-get install -y ./apptainer_${APPTAINER_VERSION}_amd64.deb

      - name: Install Snakemake
        run: pip install snakemake pandas

      - name: Cache Singularity images
        uses: actions/cache@v4
        with:
          path: .snakemake/singularity
          key: singularity-${{ hashFiles('env_config/*.yaml') }}

      - name: Build test indices
        run: |
          set -o pipefail
          snakemake \
            --snakefile tests/build_test_refs.smk \
            --use-singularity \
            --cores 2 \
            --show-failed-logs \
            --printshellcmds 2>&1 |
          sed -u '
            /^rule [a-zA-Z_]*:/{
              x
              /^./{
                s/.*/::endgroup::/
                p
              }
              x
              s/^rule \([a-zA-Z_]*\):.*/::group::Build index — \1/
              h
            }' &&
          echo "::endgroup::"

      - name: Run pipeline
        run: |
          set -o pipefail
          snakemake \
            --snakefile Snakefile \
            --configfile tests/fixtures/test_config.yaml \
            --use-singularity \
            --cores 2 \
            --show-failed-logs \
            --printshellcmds 2>&1 |
          sed -u '
            /^rule [a-zA-Z_]*:/{
              x
              /^./{
                s/.*/::endgroup::/
                p
              }
              x
              s/^rule \([a-zA-Z_]*\):.*/::group::Pipeline — \1/
              h
            }' &&
          echo "::endgroup::"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: .snakemake/log/
