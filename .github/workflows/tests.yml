name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test indices
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: tests/build_test_refs.smk
          args: "--sdm conda --cores 2 --conda-cleanup-pkgs cache"

      - name: Run pipeline
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: Snakefile
          args: "--configfile tests/fixtures/test_config.yaml --sdm conda --show-failed-logs --cores 2 --conda-cleanup-pkgs cache"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: .snakemake/log/
