name: Tests

on:
  push:
    branches: [dev-CI]
  pull_request:
    branches: [main]

jobs:
  Testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Cache Singularity images
        uses: actions/cache@v4
        with:
          path: .snakemake/singularity
          key: singularity-${{ hashFiles('env_config/*.yaml') }}

      - name: Build test indices
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: tests/build_test_refs.smk
          args: "--use-singularity --cores 2 --show-failed-logs"

      - name: Run pipeline
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: .
          snakefile: Snakefile
          args: >-
            --configfile tests/fixtures/test_config.yaml
            --use-singularity
            --show-failed-logs
            --cores 2

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snakemake-logs
          path: .snakemake/log/