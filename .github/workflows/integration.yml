name: Integration — Pipeline Run

on:
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly on Monday at 6am UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # ── Build all conda environments once and pass as artifact ──────────────────
  build-conda-envs:
    name: Build conda environments
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          init-shell: bash
          cache-downloads: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Snakemake
        run: pip install snakemake

      - name: Build all conda environments
        run: |
          snakemake \
            --use-conda \
            --conda-frontend mamba \
            --conda-create-envs-only \
            --configfile tests/fixtures/test_config.yaml \
            --snakefile Snakefile \
            --cores 2

      - name: Tar conda environments
        run: tar -czf conda_envs.tar.gz .snakemake/conda/

      - uses: actions/upload-artifact@v4
        with:
          name: conda_envs
          path: conda_envs.tar.gz
          retention-days: 1

  # ── Integration test: default config (no UMI, no spike-ins) ─────────────────
  integration:
    name: Full isomiR path (trimming → miRtop → count table)
    needs: build-conda-envs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "latest"
          init-shell: bash
          cache-downloads: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install pytest snakemake pandas

      - uses: actions/download-artifact@v4
        with:
          name: conda_envs

      - name: Restore conda environments
        run: tar -xzf conda_envs.tar.gz

      # ── Build test Bowtie1 hairpin index ─────────────────
      - name: Install bowtie1 for index building
        run: micromamba install -y -n base -c bioconda -c conda-forge bowtie

      - name: Build bowtie1 hairpin index
        run: |
          micromamba run -n base bowtie-build \
            tests/fixtures/refs/hairpin_subset.fa \
            tests/fixtures/refs/hairpin_subset
          echo "Bowtie1 index built"

      # ── Run pipeline (isomiR path only) ──────────────────
      - name: Run pipeline — isomiR path
        run: |
          snakemake \
            --use-conda \
            --conda-frontend mamba \
            --configfile tests/fixtures/test_config.yaml \
            --snakefile Snakefile \
            --cores 2 \
            --rerun-incomplete \
            miRNA_Quant/raw_merged_canonical_and_all_isomirs.csv \
            mirtop/mirtop_stats.log \
            fastQC/fastqc_multiqc_config.yaml

      # ── Run trimming + FastQC independently ──────────────
      - name: Run trimming and FastQC
        run: |
          snakemake \
            --use-conda \
            --conda-frontend mamba \
            --configfile tests/fixtures/test_config.yaml \
            --snakefile Snakefile \
            --cores 2 \
            --rerun-incomplete \
            trimming/sample_1.R1.trim.fastq.gz \
            trimming/sample_2.R1.trim.fastq.gz \
            fastQC/sample_1.R1.trim_fastqc.html \
            fastQC/sample_2.R1.trim_fastqc.html

      # ── Validate outputs ──────────────────────────────────
      - name: Validate pipeline outputs
        run: pytest tests/integration/test_outputs.py -v --tb=short
