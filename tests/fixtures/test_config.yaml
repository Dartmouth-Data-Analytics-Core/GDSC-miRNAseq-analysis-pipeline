#-------------------------------------------#
# Test configuration for CI
# Used by: dry-run tests + integration tests
# Species: Danio rerio (zebrafish)
# Spike-ins: off   UMI tools: off
#-------------------------------------------#

reference_checksums: ""
sample_csv: "tests/fixtures/sample_fastq_list.csv"
layout: "single"
use_spikeins: false
use_umitools: false
adapter_3prime: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
nextseq_trim: ""

#-------------------------------------------#
# Software paths (conda-installed binaries)
#-------------------------------------------#
seqcluster_path: "seqcluster"
bowtie1_path: "bowtie"
bowtie2_path: "bowtie2"
samtools_path: "samtools"
fastqc_path: "fastqc"
featurecounts_path: "featureCounts"
multiqc_path: "multiqc"
python_mirna_venv: "python3"
umitools_path: "umi_tools"

#-------------------------------------------#
# Reference file paths (test fixtures)
#-------------------------------------------#
# Bowtie1 index — built in CI from hairpin_subset.fa
bowtie1_hairpin_index: "tests/fixtures/refs/hairpin_subset"
bowtie1_mature_index: "tests/fixtures/refs/mature_subset"

# Bowtie2 padded mature index — uses existing repo refs
padded_mature_index: "refs/mirbase_mature"

# Genome index — tiny synthetic genome for CI
bowtie2_genome_index: "tests/fixtures/refs/tiny_genome"
annotation_gtf: "tests/fixtures/refs/tiny.gtf"

# miRtop references
hairpin_gff: "tests/fixtures/refs/hairpin_subset.gff3"
hairpin_fa: "tests/fixtures/refs/hairpin_subset.fa"
sps: "dre"

#-------------------------------------------#
# Spike-in settings (required even when off)
#-------------------------------------------#
sample_with_spikein_finalvolume: 5
bowtie_spikein_index: "tests/fixtures/refs/spikeins_stub"
spikein_reference_core: "tests/fixtures/refs/spikeins_stub.fa"

#-------------------------------------------#
# Utilities
#-------------------------------------------#
pca_plot_script: "scripts/pca_plotting.py"
featurecounts_annscript: "scripts/add_gene_to_ensg.py"
featurecounts_strand: "0"
