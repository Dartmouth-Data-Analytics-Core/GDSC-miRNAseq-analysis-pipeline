report_header_info:
  - Contact E-mail:  DataAnalyticsCore@groups.dartmouth.edu
  - Application Type: "miRNA-seq"


extra_fn_clean_trim:
  - "_genome.log.txt"
  - "_mirbase.log.txt"
  - ".srt.dedup.filt.bam"
  - ".umi.fastq.gz"
  - ".umi"

use_filename_as_sample_name:
  - bowtie2

sp:
  bowtie2:
    - fn: "*_genome.log.txt"
    - fn: "*_mirbase.log.txt"

module_order:
  - "fastqc"
  - "star"
  - "samtools"
  - "picard"
  - "featurecounts"
  - "rsem"

report_section_order:
    fastqc:
        order: 1000
    star:
        order: 950
    picard:
        order: 900
    Samtools:
        order: 850
    featurecounts:
        order: 750
        
table_columns_visible:
  featureCounts: False  
  Samtools: False

fn_ignore_files:
  - "*.flagstat"
  - "*.idxstats"

