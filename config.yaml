###~~~~~~ general settings ~~~~~~###

# sample meta data file
sample_csv: "sample_fastq_list.csv"

############################################
# general setting 
############################################
# sequencing config
layout: "single"
use_spikeins: false
use_umitools: false
adapter_3prime: "AGATCGGAAGAGCACACGTCTGAACTCCAGTCA"
#nextseq_trim: "--nextseq-trim=30" # cutadapt flag and value for NextSeq quality trimming; set to "" to disable
nextseq_trim: ""
############################################
# spike-in info
sample_with_spikein_finalvolume: 5 # if using NextFLEX, need to change this value
bowtie_spikein_index: "/dartfs-hpc/rc/lab/G/GMBSR_bioinfo/Labs/howe/250805_smRNA/spike-in_pipeline/GDSC-miRNAseq-analysis-pipeline/refs/spikeins/spikeins_full"
spikein_reference_core: "/dartfs-hpc/rc/lab/G/GMBSR_bioinfo/Labs/howe/251106_miRNA/refs/spikeins/spikeins_core.fa"

#############################################
# Software Paths for use with "--use-conda" #
############################################# 
umitools_path: "/dartfs-hpc/rc/lab/G/GMBSR_bioinfo/misc/shared-software/tools/umi-tools/umi_tools"
samtools_path: "/dartfs-hpc/rc/lab/G/GMBSR_bioinfo/misc/sullivan/tools/samtools/samtools-1.11/samtools"
bowtie1_path: "/dartfs-hpc/rc/lab/G/GMBSR_bioinfo/misc/shared-software/tools/bowtie/bowtie"
bowtie2_path: "/dartfs-hpc/rc/lab/G/GMBSR_bioinfo/misc/sullivan/tools/bowtie2/bowtie2-2.4.4-linux-x86_64/bowtie2"
